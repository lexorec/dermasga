specialties:
  - title: "Dermatología clínica"
    text: "Diagnóstico y tratamiento de acné, rosácea, dermatitis, psoriasis y otras enfermedades de la piel en adultos."
  - title: "Dermatología pediátrica"
    text: "Cuidado de la piel de bebés, niños y adolescentes, con formación en el Hospital Pediátrico Borrás Marfán de La Habana."
  - title: "Lunares y cáncer de piel"
    text: "Revisión de lunares y lesiones sospechosas para la detección temprana del cáncer de piel."
  - title: "Infecciones de la piel"
    text: "Hongos, bacterias y parásitos como la escabiosis, con apoyo diagnóstico de la luz de Wood."
  - title: "Dermocosmética y rejuvenecimiento"
    text: "Rutinas de cuidado, manchas y envejecimiento de la piel, con procedimientos de medicina estética facial."
  - title: "Infecciones de transmisión sexual"
    text: "Evaluación confidencial y tratamiento de las manifestaciones en piel y mucosas."

about:
  paragraphs:
    - "Graduada en Cuenca, en la Universidad Católica de Cuenca, y especialista en Dermatología por la Universidad de Ciencias Médicas de La Habana, donde realizó su residencia en el Hospital Docente Clínico Quirúrgico Comandante Manuel Fajardo y se formó en dermatología pediátrica en el Hospital Borrás Marfán."
    - "Culminó la especialidad con las mejores calificaciones, reconocimiento otorgado por la Embajada de Ecuador en Cuba. Desde 2021 atiende en su consultorio dermatológico en Machala."
