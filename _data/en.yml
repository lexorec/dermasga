hero:
  eyebrow: "DERMASGA · Dermatologist in Machala, Ecuador"
  title: "Dermatology care in English, in Machala"
  lead: "Dr. Marcela Astudillo G. is a dermatologist trained in Havana, Cuba, with a private practice in Machala since 2021. She sees adults and children, and consultations are available in English and Spanish."

